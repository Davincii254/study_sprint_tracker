<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Sprint Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7faf8;
      color: #13293d;
    }
    main {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 18px;
    }
    header {
      background: #13293d;
      color: white;
      padding: 26px;
      border-radius: 18px;
    }
    section {
      background: white;
      border: 1px solid #d8e7df;
      border-radius: 16px;
      padding: 18px;
      margin-top: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 10px 0 6px;
    }
    input, select, button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #bcd8c8;
      font-size: 14px;
    }
    button {
      background: #0b7a4b;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    button.secondary {
      background: #f58220;
    }
    button.danger {
      background: #bb3e03;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
    }
    .status {
      background: #fff8f1;
      border-left: 5px solid #f58220;
      padding: 12px;
      border-radius: 12px;
      margin-top: 14px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #e5eee9;
      padding: 12px 0;
    }
    .complete {
      text-decoration: line-through;
      color: #5f6b66;
    }
    small {
      color: #5f6b66;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Study Sprint Tracker</h1>
      <p>Practice fetch(), Flask routes, JSON responses, cookies, and sessions.</p>
    </header>

    <section>
      <h2>1. Session: identify the learner</h2>
      <div class="row">
        <div>
          <label for="username">Username</label>
          <input id="username" placeholder="e.g. Amina" />
        </div>
        <button onclick="login()">Login</button>
        <button class="danger" onclick="logout()">Logout</button>
      </div>
      <div id="userStatus" class="status">Loading session data...</div>
    </section>

    <section>
      <h2>2. Cookie: save a non-sensitive preference</h2>
      <div class="row">
        <div>
          <label for="focusMode">Focus mode</label>
          <select id="focusMode">
            <option value="standard">Standard</option>
            <option value="deep">Deep Work</option>
            <option value="revision">Revision</option>
            <option value="practice">Practice</option>
          </select>
        </div>
        <button class="secondary" onclick="saveFocusMode()">Save Focus Mode</button>
      </div>
      <small>Open DevTools → Application → Cookies to inspect the focus_mode cookie.</small>
    </section>

    <section>
      <h2>3. CRUD: manage study sprints</h2>
      <div class="row">
        <div>
          <label for="topic">Study topic</label>
          <input id="topic" placeholder="e.g. PATCH requests" />
        </div>
        <div>
          <label for="minutes">Minutes</label>
          <input id="minutes" type="number" value="25" min="5" />
        </div>
        <button onclick="createStudySession()">Add Sprint</button>
      </div>
      <div id="sessions"></div>
    </section>
  </main>

  <script>
    async function requestJSON(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Something went wrong.');
      }

      return data;
    }

    async function loadUser() {
      const data = await requestJSON('/api/me');
      const name = data.username || 'Guest';
      document.getElementById('userStatus').innerHTML = `
        <strong>Current learner:</strong> ${name}<br />
        <strong>Session visits:</strong> ${data.visits}<br />
        <strong>Focus mode cookie:</strong> ${data.focus_mode}
      `;
      document.getElementById('focusMode').value = data.focus_mode;
    }

    async function login() {
      const username = document.getElementById('username').value;
      await requestJSON('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      document.getElementById('username').value = '';
      await loadUser();
    }

    async function logout() {
      await requestJSON('/api/logout', { method: 'POST' });
      await loadUser();
    }

    async function saveFocusMode() {
      const mode = document.getElementById('focusMode').value;
      await requestJSON('/api/focus-mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode })
      });
      await loadUser();
    }

    async function loadStudySessions() {
      const sessions = await requestJSON('/api/study-sessions');
      const container = document.getElementById('sessions');
      container.innerHTML = sessions.map(item => `
        <div class="item">
          <div>
            <strong class="${item.completed ? 'complete' : ''}">${item.topic}</strong><br />
            <small>${item.minutes} minutes | ${item.completed ? 'Completed' : 'Pending'}</small>
          </div>
          <div>
            <button onclick="completeStudySession(${item.id})">Complete</button>
            <button class="danger" onclick="deleteStudySession(${item.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function createStudySession() {
      const topic = document.getElementById('topic').value;
      const minutes = document.getElementById('minutes').value;
      await requestJSON('/api/study-sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic, minutes })
      });
      document.getElementById('topic').value = '';
      await loadStudySessions();
    }

    async function completeStudySession(id) {
      await requestJSON(`/api/study-sessions/${id}`, { method: 'PATCH' });
      await loadStudySessions();
    }

    async function deleteStudySession(id) {
      await requestJSON(`/api/study-sessions/${id}`, { method: 'DELETE' });
      await loadStudySessions();
    }

    loadUser();
    loadStudySessions();
  </script>
</body>
</html>
